services:
  - type: web
    name: bharat-fpo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MASTER_CSV
        value: data/india_mandi_master.csv
      - key: METRICS_FILE
        value: data/model_metrics.jsonl
